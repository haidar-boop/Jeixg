# QuantTrade configuration.
#
# Values here are overridden by environment variables prefixed with QT_ using
# double-underscore nesting, e.g. QT_RISK__MAX_DAILY_LOSS_PCT=0.02
# Secrets (API keys/passwords) must NOT live here -- use environment variables.

app:
  name: QuantTrade
  env: development          # development | staging | production
  timezone: America/New_York

trading:
  mode: paper               # paper | live | backtest | forward_test
  base_currency: USD
  strategy: rsi_reversion   # strategy shown on the dashboard watchlist

data:
  provider: synthetic       # synthetic | yfinance
  cache_dir: .cache
  cache_ttl_seconds: 3600

broker:
  name: paper               # paper | alpaca | interactive_brokers | tradier | ...
  starting_cash: 100000.0
  commission_per_share: 0.005
  slippage_bps: 1.0
  max_capital: 0            # cap total $ the bot deploys (0 = no cap; e.g. 1000)

risk:
  max_daily_loss_pct: 0.03      # halt trading after a 3% loss in a day
  max_drawdown_pct: 0.20        # halt trading on a 20% peak-to-trough drawdown
  max_position_pct: 0.20        # max 20% of equity in any one position
  max_gross_exposure_pct: 1.5   # max 150% gross exposure (allows modest leverage)
  max_sector_pct: 0.30          # max 30% of equity in any one sector
  max_correlation: 0.85         # block adding highly correlated exposure
  default_risk_per_trade_pct: 0.0075   # ~15% position with a 5% stop (under the 20% cap)
  kelly_fraction: 0.5           # fractional Kelly multiplier

database:
  url: sqlite:///quanttrade.db  # e.g. postgresql+psycopg://user:pass@host/db
  echo: false

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

logging:
  level: INFO
  dir: logs
  json: false
