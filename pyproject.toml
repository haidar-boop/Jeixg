[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrade"
version = "0.1.0"
description = "A modular, production-grade algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantTrade" }]
keywords = ["trading", "algorithmic-trading", "backtesting", "quant", "finance"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
wsgi = ["flask>=3.0"]  # WSGI dashboard for PythonAnywhere / gunicorn hosts
data = ["yfinance>=0.2"]
security = ["cryptography>=42.0"]
brokers = ["requests>=2.31", "alpaca-trade-api>=3.0", "ib_insync>=0.9"]
ml = ["tensorflow>=2.15", "transformers>=4.38"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8"]
all = [
    "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0",
    "yfinance>=0.2", "cryptography>=42.0", "requests>=2.31",
]

[project.scripts]
quanttrade = "quanttrade.cli:main"

[tool.setuptools.packages.find]
include = ["quanttrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
